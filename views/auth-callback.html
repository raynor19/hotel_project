<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Autentikasi Google — HotelKu</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #1A1A1A 0%, #2A241E 100%);
      color: #fff;
    }
    .card {
      background: rgba(35, 30, 26, 0.95);
      border: 1px solid rgba(196, 162, 101, 0.3);
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(196, 162, 101, 0.2);
      border-top-color: #C4A265;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 {
      color: #E8D7B5;
      font-size: 1.35rem;
      margin: 0 0 10px;
      font-weight: 600;
    }
    p {
      color: #A99E91;
      font-size: 0.9rem;
      margin: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2 id="title">Memverifikasi Akun Google...</h2>
    <p id="desc">Sedang menyinkronkan profil Anda dengan HotelKu. Mohon tunggu sejenak.</p>
  </div>

  <script>
    (async () => {
      try {
        const hash = window.location.hash;
        if (!hash) {
          window.location.href = '/login';
          return;
        }

        const params = new URLSearchParams(hash.substring(1));
        const accessToken = params.get('access_token');

        if (!accessToken) {
          window.location.href = '/login';
          return;
        }

        const SUPABASE_URL = 'https://pxxpccvvfxcnvlurmuok.supabase.co';
        const userRes = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          headers: {
            'Authorization': `Bearer ${accessToken}`,
            'apikey': 'sb_publishable_oVQejlvHLsob0UadTCTD8A_mQJe7chn'
          }
        });
        const authUser = await userRes.json();

        if (authUser && authUser.email) {
          const loginRes = await fetch('/api/auth/google/callback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: authUser.email,
              name: authUser.user_metadata?.full_name || authUser.user_metadata?.name || authUser.email.split('@')[0],
              phone: authUser.phone || authUser.user_metadata?.phone || ''
            })
          });
          const loginData = await loginRes.json();
          if (loginData.success && loginData.user) {
            localStorage.setItem('hotelku_user', JSON.stringify(loginData.user));
            localStorage.removeItem('hotelku_my_rsv');
            window.location.href = '/rooms';
            return;
          }
        }
        window.location.href = '/login?error=oauth_failed';
      } catch (err) {
        console.error(err);
        window.location.href = '/login?error=oauth_exception';
      }
    })();
  </script>
</body>
</html>
